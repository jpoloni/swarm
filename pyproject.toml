[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-oneshot"
version = "0.1.0"
description = "One-shot multi-agent orchestration with configurable OpenAI Agents SDK models"
requires-python = ">=3.11"
dependencies = [
  "openai-agents==0.22.3",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
swarm-oneshot = "swarm_oneshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
