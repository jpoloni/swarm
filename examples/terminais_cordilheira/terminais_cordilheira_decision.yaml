schema_version: "1"
run_id: "terminais-cordilheira-q4-2026-blind"
objective: >-
  Elaborar o Parecer Técnico Externo independente da Consultoria para o Conselho de Administração
  da Terminais Cordilheira S.A. (reunião de 29/09/2026), avaliando criticamente o pacote consolidado da Diretoria
  (DOC-02/DOC-03), suas premissas (P1 a P8) e as medidas emergenciais do Q4/2026. O parecer deve cumprir rigorosamente
  os 8 requisitos obrigatórios do Termo de Referência (DOC-00):
  1. Afirmações com ID canônico [Cxx], doc_id e citação literal;
  2. Decisões ancoradas nos IDs das afirmações;
  3. Afirmações sem consequência decisória com justificativa;
  4. Tabela de alocação por fonte, separando destino de fonte, com saldos e sobras (CAPEX, custeio, rubrica regulatória, recursos vinculados e capacidade física);
  5. Cronograma físico por trimestre comparando capacidade líquida, rotina e projetos;
  6. Registro de riscos com item/frente, exposição financeira (R$ MM), dono e gatilho de escalonamento;
  7. Análise individualizada das premissas P1 a P8, confrontando com as evidências documentais e declarando expressamente quais se sustentam e quais são contestadas/quebradas;
  8. Apêndice de cálculo detalhado recalculando tudo do zero com fórmulas no formato 'conta = resultado'.
  Identificar e intimar formalmente com prazo e responsável todas as medidas e obrigações inadiáveis com vencimento próximo identificadas no corpus documental.
context:
  text: >-
    Você é a consultoria independente contratada pelo Conselho de Administração da Terminais Cordilheira S.A.
    O Conselho desconfia de inconsistências, riscos ocultos e premissas frágeis no pacote consolidado submetido
    pela Diretoria Executiva (DOC-02 e DOC-03). Audite com profundidade e rigor técnico todos os 28 documentos anexos
    (DOC-01 a DOC-28), recalculando de forma independente a viabilidade operacional, financeira, regulatória e contratual.
  artifacts:
    - 01_mandato_e_secao1.md
    - 02_secao2_frentes_propostas.md
    - 03_secao3_quadro_diretoria_premissas.md
    - 04_anexos_operacionais_financeiros.md
    - 05_anexos_regulatorios_tecnicos.md
orchestrators:
  count: 2
  agents:
    - id: relator-consultoria
      role: primary
      model: "gpt-5.6-luna"
      instructions: >-
        Crie exatamente uma frente 'parecer-conselho' atribuída ao 'coordenador-governanca-riscos'.
        Crie exatamente três tarefas nessa frente, uma para cada analista, usando estritamente os IDs:
        'analista-engenharia-operacoes', 'analista-financas-orcamento' e 'analista-contratos-regulacao'.
        Consolide os achados dos três analistas em um Parecer Técnico Externo completo, independente e conclusivo,
        atendendo rigorosamente aos 8 requisitos mandatórios do DOC-00, incluindo as deliberações recomendadas ao Conselho,
        atos urgentes com prazos e responsáveis, o cronograma físico líquido e o apêndice de cálculo explícito.
    - id: coordenador-governanca-riscos
      role: coordinator
      model: "gpt-5.6-luna"
      instructions: >-
        Oriente os analistas a auditarem criticamente os documentos de suas respectivas áreas e cruze os achados
        para verificar consistência entre prazos contratuais, restrições físicas de engenharia e sustentabilidade econômico-financeira.
        Na etapa de revisão, retorne no campo 'track_id' o valor 'parecer-conselho' e no campo 'accepted_task_ids'
        estritamente a lista dos IDs das tarefas aceitas presentes em task_results (ex: 'tarefa-engenharia-operacoes',
        'tarefa-financas-orcamento', 'tarefa-contratos-regulacao'). Jamais coloque IDs de afirmações [Cxx] em accepted_task_ids.
        Assegure que os 8 itens obrigatórios do DOC-00 foram integralmente cobertos e fundamentados com evidências literais.
workers:
  count: 3
  agents:
    - id: analista-engenharia-operacoes
      specialty: >-
        Audite as condições físicas e operacionais do terminal (DOC-01 a DOC-05 e anexos técnicos DOC-17 a DOC-24).
        Analise a situação de calado, assoreamento e capacidade dos berços B01 a B04; o sinistro do SH-3 e as opções
        operacionais para o B04; a viabilidade física e métodos construtivos das frentes de obra propostas (F1 a F9);
        a batimetria e as janelas ambientais/técnicas para dragagem; e calcule a disponibilidade real de berço-dias por trimestre e no ano.
      model: "gpt-5.6-luna"
      tools: [document_search, repository_read]
    - id: analista-financas-orcamento
      specialty: >-
        Audite as contas financeiras e orçamentárias (DOC-03, DOC-04, DOC-06, DOC-07, DOC-12, DOC-16, DOC-26, DOC-27).
        Recalcule a disponibilidade real de recursos em cada fonte (CAPEX, custeio, contingências, recursos vinculados e cauções),
        verifique a conformidade com as políticas corporativas (ex: PO-07) e atas do Conselho, avalie a veracidade das estimativas de ganho
        e despesa das frentes (F1 a F9) e simule os impactos no EBITDA e no cumprimento dos covenants da dívida.
      model: "gpt-5.6-luna"
      tools: [document_search, repository_read]
    - id: analista-contratos-regulacao
      specialty: >-
        Audite os instrumentos contratuais, jurídicos e regulatórios (DOC-00, DOC-08 a DOC-15, DOC-18, DOC-25).
        Analise as cláusulas de desempenho mínimo e riscos de rescisão do arrendamento portuário ANTAQ; contratos comerciais e ferroviários
        (FLN, NOVAGRO); obrigações judiciais e ambientais (TAC/TCP de dragagem); prazos de inspeção regulatória (ACE), seguros e cauções;
        confronte as premissas da Diretoria (P1 a P8) com as obrigações legais e liste todos os prazos críticos e atos inadiáveis.
      model: "gpt-5.6-luna"
      tools: [document_search, repository_read]
execution:
  max_parallel_workers: 3
  max_model_calls: 32
  worker_max_turns: 8
  timeout_seconds: 400
  worker_timeout_seconds: 180
  max_retries_per_task: 1
  on_worker_failure: partial
  allowed_models: ["gpt-5.6-luna", "gpt-5.6-sol"]
output:
  language: pt-BR
  format: markdown
  require_evidence: true
