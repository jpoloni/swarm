schema_version: "1"
run_id: "aurora-horizonte-digital-2027-blind-terra"
objective: >-
  Elaborar o Parecer Executivo de Recomendação para o Comitê de Investimentos em TIC da Aurora Energia S.A.
  (reunião de 08/10/2026), definindo a alocação da carteira 2027 do Programa Horizonte Digital e auditando
  criticamente as frentes propostas (F1 a F6) e os compromissos contratuais. O parecer deve cumprir rigorosamente
  as diretrizes mandatórias MUST-01 a MUST-10 da Política de Decisão (DOC-HD-COMITÊ-2026-10):
  1. Respeitar o teto orçamentário da DFI (discriminando comprometido e discricionário);
  2. Tratar explicitamente cada um dos cinco compromissos contratuais;
  3. Declarar e respeitar as dependências técnicas inviabilizantes;
  4. Endereçar o prazo crítico de auditoria regulatória de cibersegurança OT;
  5. Endereçar a continuidade operacional pós-vencimento do contrato de fábrica de software;
  6. Tratar a sustentação dos sistemas em produção (F6);
  7. Revisar criticamente o business case e o VPL com base em evidências internas;
  8. Posicionar formalmente a solução paralela contratada pelo E&P;
  9. Amarrar o cronograma físico às janelas reais de parada offshore;
  10. Registrar os riscos de todos os itens não financiados com donos formais e critérios claros de escalonamento.
context:
  text: >-
    Você assessora o Comitê de Investimentos em TIC da Aurora Energia S.A. O Programa Horizonte Digital
    solicitou R$ 96,0 MM para 2027, mas a Diretoria Financeira (DFI) fixou um teto inegociável de R$ 58,0 MM.
    Audite com profundidade e independência técnica o case do programa, a política de decisão e o glossário
    (case_horizonte_digital.md, politica_decisao_horizonte_2027.md e glossario.md), avaliando viabilidade técnica,
    orçamentária, contratual e regulatória sem assumir premissas não comprovadas.
  artifacts:
    - case_horizonte_digital.md
    - politica_decisao_horizonte_2027.md
    - glossario.md
orchestrators:
  count: 2
  agents:
    - id: relator-comite
      role: primary
      model: "gpt-5.6-luna"
      instructions: >-
        Crie exatamente uma frente 'governanca-carteira' atribuída ao 'coordenador-governanca'.
        Crie exatamente três tarefas nessa frente, uma para cada analista, usando estritamente os IDs:
        'analista-orcamento-contratos', 'analista-viabilidade-tecnica' e 'analista-risco-regulatorio'.
        Consolide os achados dos três analistas em um Parecer Executivo completo, independente e conclusivo,
        atendendo rigorosamente aos requisitos mandatórios MUST-01 a MUST-10 da política de decisão,
        com deliberações justificadas para cada projeto e contrato, riscos com donos e critérios de escalonamento.
    - id: coordenador-governanca
      role: coordinator
      model: "gpt-5.6-luna"
      instructions: >-
        Oriente os analistas a auditarem criticamente os documentos de suas respectivas áreas e cruze os achados
        para garantir coerência entre restrições orçamentárias, viabilidade técnica de infraestrutura e prazos regulatórios.
        Na etapa de revisão, retorne no campo 'track_id' o valor 'governanca-carteira' e no campo 'accepted_task_ids'
        estritamente a lista dos IDs das tarefas aceitas presentes em task_results (ex: 'tarefa-orcamento-contratos',
        'tarefa-viabilidade-tecnica', 'tarefa-risco-regulatorio'). Jamais coloque IDs inválidos em accepted_task_ids.
        Assegure que os requisitos MUST-01 a MUST-10 foram integralmente cobertos com evidências do texto.
workers:
  count: 3
  agents:
    - id: analista-orcamento-contratos
      specialty: >-
        Audite as contas financeiras e compromissos contratuais do programa. Analise a alocação frente ao teto
        de R$ 58,0 MM (comprometido vs discricionário); examine os cinco contratos legados e opções de manutenção,
        renegociação ou rescisão; audite os números do business case original frente às medições reais do projeto
        e identifique donos e gatilhos de escalonamento para restrições financeiras.
      model: "gpt-5.6-terra"
      tools: [document_search, repository_read]
    - id: analista-viabilidade-tecnica
      specialty: >-
        Audite a viabilidade técnica e arquitetural dos projetos propostos (F1 a F6). Analise a prontidão da infraestrutura
        (redes, banda, conectividade, sensoriamento e telemetria); mapeie dependências técnicas entre as frentes;
        avalie a compatibilidade com os tipos de ativos offshore (próprios vs afretados BOT vs plataformas fixas) e
        verifique a integridade dos dados históricos e requisitos das paradas operacionais.
      model: "gpt-5.6-terra"
      tools: [document_search, repository_read]
    - id: analista-risco-regulatorio
      specialty: >-
        Audite os riscos regulatórios, de cibersegurança OT, continuidade operacional e governança de stakeholders.
        Avalie o prazo e as exigências da auditoria regulatória da ANP; a transição de serviços críticos e sustentação;
        posicione soluções paralelas e possíveis conflitos de interesse de stakeholders reportados nos documentos;
        e estruture o mapa de riscos dos itens não financiados com donos e critérios de escalonamento.
      model: "gpt-5.6-terra"
      tools: [document_search, repository_read]
execution:
  max_parallel_workers: 3
  max_model_calls: 24
  worker_max_turns: 8
  timeout_seconds: 360
  worker_timeout_seconds: 140
  max_retries_per_task: 1
  on_worker_failure: partial
  allowed_models: ["gpt-5.6-luna", "gpt-5.6-sol", "gpt-5.6-terra"]
output:
  language: pt-BR
  format: markdown
  require_evidence: true
