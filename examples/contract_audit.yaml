schema_version: "1"
run_id: "due-diligence-contrato-saas-terra"
objective: >-
  Auditar a minuta do contrato B2B SaaS (minuta_contrato_saas.txt) defendendo os interesses
  da CONTRATANTE. Identificar cláusulas abusivas, desequilíbrio contratual, riscos patrimoniais,
  operacionais e regulatórios (LGPD), classificando a severidade e propondo a redação revisada
  para renegociação.
context:
  text: >-
    Nossa empresa é a CONTRATANTE. O contrato foi enviado pela fornecedora e apresenta fortes
    assimetrias. Avalie com rigor a exposição a multas, responsabilidade civil, retenção de dados,
    privacidade e continuidade operacional.
  artifacts:
    - minuta_contrato_saas.txt
orchestrators:
  count: 2
  agents:
    - id: principal
      role: primary
      model: "gpt-5.6-luna"
      instructions: >-
        Crie exatamente uma frente 'frente-juridica' atribuída ao 'coordenador-juridico'.
        Crie exatamente três tarefas nessa frente, uma para cada worker, usando estritamente os IDs:
        'auditor-rescisao-vigencia', 'auditor-responsabilidade-sla' e 'auditor-dados-privacidade'.
        Consolide uma Matriz de Riscos Executiva (Alta / Média / Baixa) com cláusula, linha,
        impacto prático e proposta de contra-redação para o jurídico negociar.
    - id: coordenador-juridico
      role: coordinator
      model: "gpt-5.6-luna"
      instructions: >-
        Oriente os auditores a fundamentarem cada achado citando obrigatoriamente a cláusula e a linha
        correspondente do texto. Rejeite apontamentos genéricos ou sem respaldo documental.
workers:
  count: 3
  agents:
    - id: auditor-rescisao-vigencia
      specialty: >-
        Audite os termos de vigência, regras de renovação, condições de término/resilição/rescisão,
        multas compensatórias e mecanismos de solução de controvérsias (foro, lei aplicável, arbitragem e sucumbência).
      model: "gpt-5.6-terra"
      tools: [document_search, repository_read]
    - id: auditor-responsabilidade-sla
      specialty: >-
        Audite os níveis de serviço (SLA), disponibilidade técnica, métricas e créditos por descumprimento,
        bem como os limites e exclusões de responsabilidade civil (liability caps, danos indiretos e assimetrias).
      model: "gpt-5.6-terra"
      tools: [document_search, repository_read]
    - id: auditor-dados-privacidade
      specialty: >-
        Audite as cláusulas de privacidade, proteção de dados pessoais (LGPD), propriedade e uso de dados
        corporativos (incluindo inteligência artificial e monetização), segurança, suboperadores e prazos de notificação.
      model: "gpt-5.6-terra"
      tools: [document_search, repository_read]
execution:
  max_parallel_workers: 3
  max_model_calls: 16
  timeout_seconds: 300
  worker_timeout_seconds: 120
  max_retries_per_task: 1
  on_worker_failure: partial
  allowed_models: ["gpt-5.6-luna", "gpt-5.6-sol", "gpt-5.6-terra"]
output:
  language: pt-BR
  format: markdown
  require_evidence: true
